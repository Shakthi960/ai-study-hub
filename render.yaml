services:
  - type: web
    name: ai-study-hub
    runtime: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-study-hub-db
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: ""
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    buildArgs:
      - key: VITE_SUPABASE_URL
        value: VITE_SUPABASE_URL
      - key: VITE_SUPABASE_ANON_KEY
        value: VITE_SUPABASE_ANON_KEY
    healthCheckPath: /api/health

databases:
  - name: ai-study-hub-db
    plan: free
    databaseName: ai_study_hub
    user: ai_study_hub
